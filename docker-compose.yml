services:
  postgres:
    image: postgres:17-alpine
    container_name: linux-access-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: linux_access_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linux_access_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
