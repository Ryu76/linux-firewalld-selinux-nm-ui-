[project]
name = "linux-access-control-hub"
version = "0.1.0"
description = "Rocky Linux 9.x access control hub (Agent + Controller)"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
agent = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
]
controller = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
